[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "runform"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy", "scipy", "opencv-python", "mediapipe", "flask>=3.1"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
garmin = ["garminconnect>=0.3.20", "google-genai", "python-dotenv"]

[project.scripts]
runform = "runform.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
runform = ["static/*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
pythonpath = ["src"]
